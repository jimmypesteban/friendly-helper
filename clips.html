<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clip Library</title>
<style>:root{--bg:#141414;--fg:#f2f2f2;--muted:#9a9a9a}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;padding:16px}
h1{font-size:18px;margin:0 0 4px}p{margin:0 0 16px;color:var(--muted)}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
figure{margin:0}video{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#000;display:block}
figcaption{display:flex;flex-direction:column;padding-top:6px}figcaption span{color:var(--muted)}</style></head>
<body><h1>Friendly Helper clip library</h1><p>10 clips, one per setting. The game freezes each at 6s and shows the choices.</p><main>
<figure><video src="Scene.mp4" autoplay muted loop playsinline></video><figcaption><b>lobby</b><span>the lobby of your apartment building</span></figcaption></figure>
<figure><video src="clips/school-corridor.mp4" autoplay muted loop playsinline></video><figcaption><b>school-corridor</b><span>the corridor of your primary school</span></figcaption></figure>
<figure><video src="clips/classroom.mp4" autoplay muted loop playsinline></video><figcaption><b>classroom</b><span>your classroom</span></figcaption></figure>
<figure><video src="clips/playground.mp4" autoplay muted loop playsinline></video><figcaption><b>playground</b><span>the housing estate playground</span></figcaption></figure>
<figure><video src="clips/library.mp4" autoplay muted loop playsinline></video><figcaption><b>library</b><span>the public library</span></figcaption></figure>
<figure><video src="clips/cha-chaan-teng.mp4" autoplay muted loop playsinline></video><figcaption><b>cha-chaan-teng</b><span>a cha chaan teng at lunchtime</span></figcaption></figure>
<figure><video src="clips/mtr.mp4" autoplay muted loop playsinline></video><figcaption><b>mtr</b><span>an MTR train carriage</span></figcaption></figure>
<figure><video src="clips/supermarket.mp4" autoplay muted loop playsinline></video><figcaption><b>supermarket</b><span>the neighbourhood supermarket</span></figcaption></figure>
<figure><video src="clips/park.mp4" autoplay muted loop playsinline></video><figcaption><b>park</b><span>the sitting-out area in the park</span></figcaption></figure>
<figure><video src="clips/basketball-court.mp4" autoplay muted loop playsinline></video><figcaption><b>basketball-court</b><span>the school basketball court during PE</span></figcaption></figure>
</main></body></html>
